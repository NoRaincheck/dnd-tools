[project]
name = "adventure-webapp"
version = "0.1.0"
description = "Adventure Webapp — single-scene choose-your-adventure playable via Fused + Triple-O + action_roll"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "NoRaincheck", email = "2498638+NoRaincheck@users.noreply.github.com" }]
dependencies = [
    "dnd-tools>=0.1.0",
    "triple-o>=0.1.0",
    "fused>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
adventure = "adventure_webapp.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "E722"]

[tool.uv.sources]
dnd-tools = { workspace = true }
triple-o = { workspace = true }
fused = { workspace = true }
